<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>BVN 切片 4 预览</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        width: 1000px;
        max-width: 100vw;
        aspect-ratio: 1000 / 600;
      }
      #hint {
        position: fixed;
        top: 8px;
        left: 12px;
        color: #9ad;
        font: 12px monospace;
      }
      #err {
        position: fixed;
        top: 28px;
        left: 12px;
        right: 12px;
        color: #f66;
        font: 12px monospace;
        white-space: pre-wrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hint">P1: WASD 移动 / J 攻击 / K 跳 / L 冲刺 —— P2 方向键 / 1 攻击 / 2 跳</div>
    <pre id="err"></pre>
    <script>
      // boot 错误浮层：无头截图时也能看到报错
      const errBox = document.getElementById('err');
      const showErr = (msg) => (errBox.textContent += msg + '\n');
      window.addEventListener('error', (e) => showErr('[error] ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
      window.addEventListener('unhandledrejection', (e) => showErr('[rejection] ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason)));
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
