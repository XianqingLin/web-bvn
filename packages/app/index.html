<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>BVN Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        width: min(100vw, calc(100vh * 5 / 3), 1200px);
        width: min(100vw, calc(100dvh * 5 / 3), 1200px);
        aspect-ratio: 5 / 3;
        flex-shrink: 0;
        overflow: hidden;
      }
      #err {
        position: fixed;
        top: 8px;
        left: 12px;
        right: 12px;
        color: #f66;
        font: 12px monospace;
        white-space: pre-wrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="err"></pre>
    <script>
      // boot 错误浮层：嵌入平台 iframe 内也能看到启动报错
      const errBox = document.getElementById('err');
      const showErr = (msg) => (errBox.textContent += msg + '\n');
      window.addEventListener('error', (e) => showErr('[error] ' + e.message + ' @ ' + e.filename + ':' + e.lineno));
      window.addEventListener('unhandledrejection', (e) => showErr('[rejection] ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason)));
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
